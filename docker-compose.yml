services:

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: sprintiq-web
    ports:
      - "8080:80"
    depends_on:
      - api

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: sprintiq-api
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_ACCESS_EXPIRES_IN: ${JWT_ACCESS_EXPIRES_IN}
      REFRESH_TOKEN_EXPIRES_IN: ${REFRESH_TOKEN_EXPIRES_IN}
    depends_on:
      - postgres
      - redis

  postgres:
    image: postgres:16-alpine
    container_name: sprintiq-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - sprintiq-postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: sprintiq-redis
    ports:
      - "6379:6379"

volumes:
  sprintiq-postgres-data: